name: ci

# The workload harnesses check the reader against GDAL over 14,933 real reads,
# but they need Docker, MinIO and 9.5 GB of imagery, so they cannot run here.
# tests/test_unit.py builds a small tiled COG in memory instead and checks the
# same properties with no network and no corpus.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: unit tests
        run: PYTHONPATH=.:baseline python -m pytest tests/test_unit.py -q
      - name: compile and dependency check
        run: |
          python -m compileall -q georange_io
          python -m pip check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build and check the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          # Install the wheel the way a user would, with dependencies.
          # --no-deps left numpy and tifffile out and then imported the
          # package, so this failed on a perfectly good wheel.
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          # Exercise the real entry points, not just __version__: a
          # wheel that imports but cannot construct a reader has
          # shipped before, when a module it needed was left out.
          python -c "import georange_io; from georange_io import SparseReader, describe, sbx; from georange_io.tile_index import build_index; assert georange_io.__version__ == '0.2.0'; rd = SparseReader(base_url='https://example.invalid', bucket='b'); rd.close(); print('wheel imports and constructs a reader')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
