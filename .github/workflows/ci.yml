name: ci

# The workload harnesses check the reader against GDAL over 14,933 real reads,
# but they need Docker, MinIO and 9.5 GB of imagery, so they cannot run here.
# tests/test_unit.py builds a small tiled COG in memory instead and checks the
# same properties with no network and no corpus.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: unit tests
        run: PYTHONPATH=.:baseline python -m pytest tests/test_unit.py -q
      - name: compile and dependency check
        run: |
          python -m compileall -q georange_io
          python -m pip check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build and check the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c "import georange_io; assert georange_io.__version__ == '0.2.0'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
