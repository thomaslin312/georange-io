name: release

# Publishes to PyPI with no API token, using trusted publishing: PyPI verifies
# the release came from this repo and this workflow via OIDC. Nothing secret is
# ever stored in the repo or in GitHub secrets.
#
# One-time setup on pypi.org, under Your account -> Publishing -> Add a pending
# publisher:
#     PyPI project name  georange-io
#     Owner              thomaslin312
#     Repository         georange-io
#     Workflow name      release.yml
#     Environment        pypi
#
# Then push a tag to release:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
