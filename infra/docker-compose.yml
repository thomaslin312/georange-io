name: georange-io

services:
  minio:
    image: minio/minio:latest
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: georange-io
      MINIO_ROOT_PASSWORD: georange-io123
      # Keep MinIO out of the measurement: no scanner churn during a sweep.
      MINIO_SCANNER_SPEED: slowest
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9100:9000"   # direct MinIO, used only for staging/upload
      - "127.0.0.1:9101:9001"   # console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [bench]

  proxy:
    build: ./proxy
    environment:
      UPSTREAM: http://minio:9000
      PROXY_PORT: "9000"
      CONTROL_PORT: "9010"
      LOG_DIR: /logs
    volumes:
      - ../results/raw:/logs
    ports:
      - "127.0.0.1:9200:9000"   # data path the client reads through
      - "127.0.0.1:9210:9010"   # control API
    depends_on:
      minio:
        condition: service_healthy
    networks: [bench]

  bench:
    build:
      context: ..
      dockerfile: infra/bench.Dockerfile
    working_dir: /work
    environment:
      # Anonymous /vsis3 against a public-read bucket: exercises the real
      # /vsis3 code path with no SigV4 fragility across the proxy hop.
      AWS_S3_ENDPOINT: proxy:9000
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_NO_SIGN_REQUEST: "YES"
      AWS_DEFAULT_REGION: us-east-1
      # The staged corpus predates the rename and lives in a bucket of the
      # old name. Overridable, but defaulting to it avoids a 14 GB copy or a
      # 2.4 hour re-stage just to run the harnesses.
      GEORANGE_IO_BUCKET: ${GEORANGE_IO_BUCKET:-switchback}
      GEORANGE_IO_PROXY_CONTROL: http://proxy:9010
      # Indexing, workload generation and the W5 oracle read MinIO directly,
      # bypassing the proxy, so none of that traffic lands in a measurement.
      MINIO_DIRECT: http://minio:9000
      PYTHONUNBUFFERED: "1"
    volumes:
      - ..:/work
    depends_on:
      proxy:
        condition: service_started
    networks: [bench]
    # Long-lived so the harness can exec into it repeatedly.
    command: ["sleep", "infinity"]

volumes:
  minio-data:
    # Named explicitly rather than derived from the compose project name. The
    # project was renamed from switchback to georange-io, and a derived name
    # would have silently pointed at a new empty volume, making a 9.45 GB
    # staged corpus look like it had vanished.
    name: ${GEORANGE_CORPUS_VOLUME:-switchback_minio-data}

networks:
  bench:
    driver: bridge
